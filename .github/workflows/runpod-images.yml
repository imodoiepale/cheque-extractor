name: RunPod worker images

# Builds the two serverless OCR workers and pushes them to GHCR, so RunPod
# can pull them as plain Docker images:
#   ghcr.io/imodoiepale/kyriq-paddleocr-vl:latest
#   ghcr.io/imodoiepale/kyriq-numarkdown:latest
on:
  workflow_dispatch:
  push:
    paths: ['runpod/**', '.github/workflows/runpod-images.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [paddleocr-vl, numarkdown]
    steps:
      # The CUDA base images are ~10 GB; the stock runner has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/${{ matrix.worker }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kyriq-${{ matrix.worker }}:latest
            ghcr.io/${{ github.repository_owner }}/kyriq-${{ matrix.worker }}:${{ github.sha }}
